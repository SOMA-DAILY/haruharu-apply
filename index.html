<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루하루 앱 3기 신청 💕</title>
<meta name="description" content="3일 동안 하루를 나누고, 마지막 날 서로를 고르는 하루하루 앱 3기. 서울, 경기와 광주, 전남에서 신청을 받습니다.">
<meta property="og:title" content="하루하루 앱 3기 신청 💕">
<meta property="og:description" content="서울 또는 광주 지역을 고르고 하루하루 앱 3기를 신청해 주세요.">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif;
 background:#F4F5F7;color:#16181D;min-height:100svh;display:flex;justify-content:center;
 padding:56px 20px 40px;word-break:keep-all}
.wrap{width:100%;max-width:460px;text-align:center}
.logo{width:96px;height:96px;border-radius:48px;margin:0 auto 20px;display:block;
 box-shadow:0 2px 14px rgba(0,0,0,.08)}
h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.sub{font-size:15px;line-height:1.6;color:#5B5F68;letter-spacing:-.02em}
.stat{display:inline-block;margin:16px 0 4px;font-size:14px;font-weight:700;color:#3F76C9;
 background:#EAF1FC;border-radius:999px;padding:7px 16px;letter-spacing:-.02em}
.btns{margin:32px 0 0;display:flex;flex-direction:column;gap:12px}
a.b{display:flex;align-items:center;justify-content:space-between;gap:12px;
 background:#fff;border:1px solid #E4E6EB;border-radius:16px;padding:20px 22px;
 text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.04);
 transition:transform .12s ease,box-shadow .12s ease}
a.b:active{transform:scale(.985);box-shadow:0 1px 2px rgba(0,0,0,.06)}
a.b .t{text-align:left}
a.b .t b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em}
a.b .t span{display:block;margin-top:3px;font-size:13px;color:#7A7E88;letter-spacing:-.02em}
a.b .ar{flex:none;font-size:17px;color:#B4B8C0}
a.b.main{background:#16181D;border-color:#16181D;color:#fff}
a.b.main .t span{color:#A7ACB6}
a.b.main .ar{color:#8E939D}
.mini{margin:26px 0 0;display:flex;justify-content:center;gap:18px}
.mini a{font-size:13px;color:#7A7E88;text-decoration:none;letter-spacing:-.02em;
 border-bottom:1px solid #DEE1E6;padding-bottom:1px}
.foot{margin:34px 0 0;font-size:12px;color:#A0A4AD;line-height:1.7;letter-spacing:-.02em}
@media (prefers-color-scheme:dark){
 body{background:#0F1114;color:#F2F3F5}
 a.b{background:#1A1D22;border-color:#272B32;box-shadow:none}
 a.b.main{background:#F2F3F5;border-color:#F2F3F5;color:#16181D}
 a.b.main .t span{color:#6A6E77}
 .sub{color:#9AA0A9}.stat{background:#1B2532;color:#7FA9EC}
 .mini a{color:#8B9098;border-color:#2A2E35}.foot{color:#6A6E77}
}
</style></head><body>
